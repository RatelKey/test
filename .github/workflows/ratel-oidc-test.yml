name: ratel-oidc-test

on:
  workflow_dispatch:

permissions:
  id-token: write   # required: lets GitHub mint the OIDC token
  contents: read

jobs:
  read-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Install ratel
        run: npm i -g @ratelkey/cli

      - name: Use OIDC
        run: ratel auth use oidc --burrow https://54.37.232.208:12010 --insecure_tls

      - name: Read a secret
        run: ratel secret get ratel-test-project/dev/TEST_SECRET
